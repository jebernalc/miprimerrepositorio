name: Compilar APK SOLVEX

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "android-solvex/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Generar APK instalable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: android-solvex
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar nombre del APK
        run: cp android-solvex/app/build/outputs/apk/debug/app-debug.apk SOLVEX-Cotizaciones-v1.0.0.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLVEX-Cotizaciones-APK
          path: SOLVEX-Cotizaciones-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
