name: Compilar APK SOLVEX

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "android-solvex/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generar APK instalable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: android-solvex
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar nombre del APK
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" android-solvex/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android-solvex/app/build/outputs/apk/debug/app-debug.apk "SOLVEX-Cotizaciones-v${VERSION}.apk"
          cp android-solvex/app/build/outputs/apk/debug/app-debug.apk SOLVEX-Cotizaciones.apk

      - name: Publicar APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: SOLVEX-Cotizaciones-APK
          path: SOLVEX-Cotizaciones-v*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK descargable (release público)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SOLVEX-Cotizaciones.apk "SOLVEX-Cotizaciones-v${VERSION}.apk" --clobber
          else
            gh release create "$TAG" SOLVEX-Cotizaciones.apk "SOLVEX-Cotizaciones-v${VERSION}.apk" \
              --target "${{ github.sha }}" --latest \
              --title "SOLVEX Cotizaciones v${VERSION}" \
              --notes "App Android de cotizaciones SOLVEX. Al finalizar la cotización abre WhatsApp en el chat del número del cliente con el PDF adjunto. Si ya tiene una versión anterior instalada y Android indica conflicto, desinstálela primero e instale esta."
          fi
